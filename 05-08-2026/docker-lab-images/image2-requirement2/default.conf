server {
    listen 80;
    
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity.conf;

    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
